<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Telco AI - Create Account</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="login-page">


    <!-- ======================================
         REGISTER CONTAINER
    ======================================= -->

    <div class="login-container">


        <!-- ==================================
             REGISTER CARD
        =================================== -->

        <div class="login-card">


            <!-- Logo -->

            <div class="login-logo">

                <div class="logo-icon">
                    📊
                </div>

                <div>

                    <h1>Telco AI</h1>

                    <p>
                        Customer Churn Intelligence
                    </p>

                </div>

            </div>


            <!-- Heading -->

            <div class="login-heading">

                <h2>
                    Create Account
                </h2>

                <p>
                    Create your own account to access
                    the churn prediction system.
                </p>

            </div>


            <!-- ==================================
                 REGISTER FORM
            =================================== -->

            <form id="registerForm">


                <!-- Username -->

                <div class="form-group">

                    <label for="registerUsername">
                        Username
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            👤
                        </span>

                        <input
                            type="text"
                            id="registerUsername"
                            placeholder="Enter your username"
                            autocomplete="username"
                            required
                        >

                    </div>

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            🔒
                        </span>

                        <input
                            type="password"
                            id="registerPassword"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="registerPasswordToggle"
                        >
                            👁️
                        </button>

                    </div>

                    <small class="password-hint">
                        Password must contain at least 6 characters.
                    </small>

                </div>


                <!-- Confirm Password -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            🔐
                        </span>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                            required
                        >

                    </div>

                </div>


                <!-- Message -->

                <div
                    id="registerMessage"
                    class="register-message"
                ></div>


                <!-- Register Button -->

                <button
                    type="submit"
                    class="login-button"
                    id="registerButton"
                >

                    <span>
                        Create Account
                    </span>

                    <span>
                        →
                    </span>

                </button>


            </form>


            <!-- Login link -->

            <div class="register-link">

                <span>
                    Already have an account?
                </span>

                <a href="index.html">
                    Sign In
                </a>

            </div>


        </div>


        <!-- Footer -->

        <p class="login-footer">

            🔒 Your account credentials are securely stored.

        </p>


    </div>


    <!-- Register JavaScript -->

    <script>

        // ==========================================
        // REGISTER FORM
        // ==========================================

        const registerForm =
            document.getElementById("registerForm");


        const registerMessage =
            document.getElementById("registerMessage");


        const registerButton =
            document.getElementById("registerButton");


        const passwordInput =
            document.getElementById("registerPassword");


        const confirmPasswordInput =
            document.getElementById("confirmPassword");


        // ==========================================
        // PASSWORD VISIBILITY
        // ==========================================

        const passwordToggle =
            document.getElementById(
                "registerPasswordToggle"
            );


        passwordToggle.addEventListener(
            "click",
            function () {

                if (
                    passwordInput.type === "password"
                ) {

                    passwordInput.type = "text";

                    passwordToggle.textContent =
                        "🙈";

                } else {

                    passwordInput.type =
                        "password";

                    passwordToggle.textContent =
                        "👁️";

                }

            }
        );


        // ==========================================
        // REGISTER
        // ==========================================

        registerForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const username =
                    document
                        .getElementById(
                            "registerUsername"
                        )
                        .value
                        .trim();


                const password =
                    passwordInput.value;


                const confirmPassword =
                    confirmPasswordInput.value;


                // Clear old message

                registerMessage.textContent = "";

                registerMessage.className =
                    "register-message";


                // ==================================
                // VALIDATION
                // ==================================

                if (username.length < 3) {

                    registerMessage.textContent =
                        "Username must contain at least 3 characters.";

                    registerMessage.classList.add(
                        "error-message"
                    );

                    return;

                }


                if (password.length < 6) {

                    registerMessage.textContent =
                        "Password must contain at least 6 characters.";

                    registerMessage.classList.add(
                        "error-message"
                    );

                    return;

                }


                if (
                    password !== confirmPassword
                ) {

                    registerMessage.textContent =
                        "Passwords do not match.";

                    registerMessage.classList.add(
                        "error-message"
                    );

                    return;

                }


                // ==================================
                // DISABLE BUTTON
                // ==================================

                registerButton.disabled = true;

                registerButton.innerHTML =
                    "<span>Creating Account...</span>";


                try {


                    // ==================================
                    // SEND DATA TO FLASK
                    // ==================================

                    const response =
                        await fetch(
                            "https://telco-customer-churn-backend.onrender.com/register",
                            {

                                method: "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },

                                body: JSON.stringify({

                                    username:
                                        username,

                                    password:
                                        password

                                })

                            }
                        );


                    const result =
                        await response.json();


                    // ==================================
                    // SUCCESS
                    // ==================================

                    if (
                        response.ok &&
                        result.status === "success"
                    ) {

                        registerMessage.textContent =
                            "Account created successfully! Redirecting to login...";

                        registerMessage.classList.add(
                            "success-message"
                        );


                        // Go to login page

                        setTimeout(
                            function () {

                                window.location.href =
                                    "index.html";

                            },
                            1500
                        );


                    } else {


                        // ==================================
                        // ERROR
                        // ==================================

                        registerMessage.textContent =
                            result.message ||
                            "Unable to create account.";

                        registerMessage.classList.add(
                            "error-message"
                        );


                        registerButton.disabled =
                            false;

                        registerButton.innerHTML =
                            "<span>Create Account</span><span>→</span>";

                    }


                } catch (error) {


                    console.error(
                        "Registration error:",
                        error
                    );


                    registerMessage.textContent =
                        "Unable to connect to the backend. Make sure Flask is running.";

                    registerMessage.classList.add(
                        "error-message"
                    );


                    registerButton.disabled =
                        false;

                    registerButton.innerHTML =
                        "<span>Create Account</span><span>→</span>";

                }

            }
        );

    </script>


</body>

</html>
